config_version = 14

# Section and rim colors from the old i3 bar (polybar).
[bar.default]
background_opacity = 0.75
border = "#ffffff40"
border_width = 1.0
capsule = true
capsule_border = "#8a89a4b3"
capsule_border_width = 1.5
capsule_fill = "surface_variant"
capsule_foreground = "#f8f8f8"
capsule_opacity = 0.65
center = [ "active_window", "workspaces" ]
contact_shadow = true
end = [
    "group:music",
    "group:utility",
    "group:levels",
    "group:stats",
    "group:connectivity",
    "keyboard_layout",
    "clock",
    "session"
]
font_family = "MonoLisa"
margin_edge = 10
margin_ends = 10
# Half the thickness: a pill. Capsules without a radius are pills too.
radius = 17
start = [ "launcher" ]
thickness = 34

    # Groups do not inherit the capsule_* values of the bar.
    [[bar.default.capsule_group]]
    id = "utility"
    fill = "surface_variant"
    members = [ "tray", "notifications", "clipboard", "control-center" ]
    border = "#8a89a4b3"
    foreground = "#f8f8f8"
    border_width = 1.5
    opacity = 0.65

    [[bar.default.capsule_group]]
    id = "music"
    fill = "#77a915"
    members = [ "media", "visualizer" ]
    border = "#a6e22e"
    foreground = "#f8f8f8"
    border_width = 1.5
    opacity = 0.65

    [[bar.default.capsule_group]]
    id = "levels"
    fill = "#aa7428"
    members = [ "volume", "brightness", "battery" ]
    border = "#f4a63a"
    foreground = "#f8f8f8"
    border_width = 1.5
    opacity = 0.65

    [[bar.default.capsule_group]]
    id = "stats"
    fill = "#157b8f"
    members = [ "disk", "ram", "cpu" ]
    border = "#23ceef"
    foreground = "#f8f8f8"
    border_width = 1.5
    opacity = 0.65

    [[bar.default.capsule_group]]
    id = "connectivity"
    fill = "#5a32a2"
    members = [ "network", "bluetooth" ]
    border = "#8e4fff"
    foreground = "#f8f8f8"
    border_width = 1.5
    opacity = 0.65

[dock]
enabled = true
icon_size = 35
layer = "overlay"
monitors = [ "DP-1" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660

[lockscreen]
lock_before_suspend = true
transition = [ "honeycomb" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 2560.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 5120.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true

[shell.panel]
transparency_mode = "glass"

# The five default actions, plus Hibernate. A list replaces the defaults,
# so it must set the shortcuts again.
[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "hibernate"
command = "systemctl hibernate"
shortcut = "4"

[[shell.session.actions]]
action = "reboot"
shortcut = "5"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "6"

[shell.shadow]
direction = "down_right"

[shell.window_switcher]
mru = true

[theme]
source = "custom"
custom_palette = "Skyline"

[wallpaper.default]
path = "/home/chaos/Pictures/wp13231431-5120x1440-cyberpunk-wallpapers.png"

[wallpaper.last]
path = "/home/chaos/Pictures/wp13231431-5120x1440-cyberpunk-wallpapers.png"

[wallpaper.monitors.DP-1]
path = "/home/chaos/Pictures/wp13231431-5120x1440-cyberpunk-wallpapers.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/chaos/Pictures/wp13231431-5120x1440-cyberpunk-wallpapers.png"

[widget.active_window]
max_length = 500

[widget.clock]
capsule_fill = "#157b8f"
capsule_border = "#23ceef"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
highlight_color = "#f9e4a4"

[widget.disk]
type = "sysmon"
stat = "disk_free"
path = "/"
visualization = "none"
highlight_color = "#f9e4a4"

[widget.keyboard_layout]
capsule_fill = "#77a915"
capsule_border = "#a6e22e"

[widget.launcher]
capsule_fill = "#157b8f"
capsule_border = "#23ceef"


[widget.visualizer]
type = "audio_visualizer"
width = 64
bands = 16
color_1 = "#f8f8f8"
color_2 = "#bbd48a"

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
highlight_color = "#f9e4a4"

[widget.session]
capsule_fill = "#a01849"
capsule_border = "#f92672"
# Tabler has no rebel insignia.
custom_image = "~/.config/noctalia/icons/rebel.svg"
custom_image_colorize = true

[widget.wallpaper]
enabled = false

[widget.workspaces]
anchor = true
focused_color = "#157b8f"
label_source = "name"
max_label_chars = 20
show_all_outputs = true
show_tooltip = false
style = "focus_hint"
