[[module]]
type = "Bookmarks"
surround_with_quotes = false
max_bookmarks = 2
max_length = 32

[[module]]
type = "Commit"
max_length = 48
surround_with_quotes = false
show_previous_if_empty = false
# starship-jj has no separate style for this placeholder. It uses the same
# style as a real description. So the color goes in the text itself.
# 92 is bright green, the color jj log uses for "(no description set)".
empty_text = "\u001b[92m(no description set)\u001b[0m"

[module.change]
color = "Magenta"

[module.commit]
color = "Blue"

# The part of the id after the unique prefix. jj log uses "bright black".
[module.non_unique]
color = "BrightBlack"

[[module]]
type = "State"

[module.conflict]
text = "(conflict)"
color = "Red"

[module.divergent]
text = "(divergent)"
color = "Cyan"

[module.hidden]
text = "(hidden)"
color = "Yellow"

[module.immutable]
disabled = false
text = "(immutable)"
color = "Yellow"

[module.empty]
disabled = false
text = "(empty)"
color = "BrightGreen"

[[module]]
type = "Metrics"
