format = """
$username$hostname\
[:](fg:#ff657a)\
$directory\
${custom.git_branch}\
${custom.git_status}\
${custom.jj}\
[|](fg:#7e8294)\
$time
\\$ 
"""

right_format = """$status"""

command_timeout = 1000

[status]
disabled = false

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "fg:#ff657a"
style_root = "fg:#ff657a"
format = '[$user]($style bold)'

[hostname]
ssh_only = false
ssh_symbol = "🌐"
style = "fg:#edc763"
format = '[@$ssh_symbol$hostname]($style italic)'

[directory]
style = "fg:#bad761"
format = "[$path ]($style bold)"
truncate_to_repo = true
truncation_length = 5
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[git_branch]
disabled = true
symbol = ""
style = "fg:#f89860"
format = '[$symbol $branch]($style bold)(:$remote_name/$remote_branch)'

[git_status]
disabled = true  # rendered on-demand
style = "fg:#ffd76d"
format = '[$all_status$ahead_behind ]($style)'

# custom module for jj status
[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true

# disable git modules
[git_state]
disabled = true

[git_commit]
disabled = true

[git_metrics]
disabled = true

# re-enable git_branch as long as we're not in a jj repo
[custom.git_branch]
when = true
command = "jj root >/dev/null 2>&1 || starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"

[time]
disabled = false
time_format = "%R"                # Hour:Minute Format
style = "fg:#6dcae8"
format = '[ $time ]($style bold)'

[custom.git_status]
when = true
command = "jj root >/dev/null 2>&1 || starship module git_status"
format = "$output"
description = "Only show git status if we're not in a jj repo"
