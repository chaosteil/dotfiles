# The home-manager module writes conf.d/10-identity.toml. That file holds
# user.name, user.email, the signing keys, the push bookmark template, and the
# immutable_heads() alias. jj reads conf.d after this file, so a value there
# wins. Without home-manager, set those keys here.

[colors]
"diff removed token" = { underline = false }
"diff added token" = { underline = false }

[ui]
pager = "delta"
diff-formatter = ":git"
diff-editor = ":builtin"
default-command = ["st"]

[signing]
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[git]
sign-on-push = true
subprocess = true
private-commits = "description(glob:'private:*')"

[fsmonitor]
backend = "watchman"
watchman.register-snapshot-trigger = true

[revsets]
bookmark-advance-to = 'closest_non_empty(@)'

[revset-aliases]
'closest_non_empty(to)' = 'heads(::to & ~empty())'

[aliases]
# Get the latest bookmark
bm = [
  "log",
  "-r",
  "::@- & bookmarks()",
  "-n",
  "1",
  "-G",
  "--template",
  "bookmarks",
]
# Tug the latest bookmark to the working copy
tug = ["bookmark", "advance"]
# Tug and checkout the latest bookmark
tugg = ["util", "exec", "--", "bash", "-c", """
  set -euo pipefail
  jj tug
  bookmark=$(jj bm)
  git checkout "$bookmark"
""", ""]
# Create a new bookmark and checkout the corresponding git branch while setting
# upstream
prepare-branch = ["util", "exec", "--", "bash", "-c", """
  set -euo pipefail
  if [[ $(jj isempty) == "false" ]]; then
    jj new
  fi
  branch="$USER/${1:-$(jj log -r @- -T 'change_id.short()' --no-graph)}"
  echo "$branch"
  jj bookmark create "$branch" -r @-
  git branch "$branch" --set-upstream-to=${2:-main}
  git checkout "$branch"
""", ""]
# List my bookmarks
mine = ["bookmark", "list", "-r", "mine()"]
# Show changes since trunk
stack = ["log", "-r", "fork_point(trunk()|@)::@"]
# Show the log and redraw it after every jj operation. Extra arguments go to
# `jj log`, for example `jj logwatch -r 'all()'`. Watches the op heads, so a
# jj command in another pane, or a watchman snapshot, redraws the log.
# logwatch cuts the log to the height of the terminal, so the screen does
# not scroll. A flag selects the part of the log that stays:
#   --top     The first lines. This is the default.
#   --tail    The last lines.
#   --center  The lines around `@`.
logwatch = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
  set -euo pipefail
  repo="$(jj root)/.jj/repo"
  # In a secondary workspace, .jj/repo is a file that holds the main repo path.
  if [[ -f "$repo" ]]; then
    repo="$(cat "$repo")"
  fi
  # watchexec starts the log without a terminal, so read the device of this
  # one and give it to the script. stty then reads the height from it.
  terminal=$(tty 2>/dev/null || true)
  mode=top
  args=()
  for arg in "$@"; do
    case "$arg" in
      --top|--tail|--center) mode="${arg#--}" ;;
      *) args+=("$arg") ;;
    esac
  done
  # watchexec runs one command for each redraw, and this string holds it.
  # The lines after it have no indent, because a heredoc keeps every space.
  # TOML reads a backslash as an escape, so awk needs two of them for one.
  show=$(cat <<"SHOW"
set -uo pipefail
mode="$1"
terminal="$2"
shift 2
# stty reads the height from the terminal device. `tput lines` gives the
# default of 24 here, because the output goes to a pipe and not to a screen.
rows=$(stty size <"$terminal" 2>/dev/null || true)
rows=${rows%% *}
if [[ ! $rows =~ ^[0-9]+$ || $rows -lt 2 ]]; then
  rows=${LINES:-40}
fi
# Keep one line free. A full screen of text scrolls the terminal by one line.
rows=$((rows - 1))
# --color=always: the capture turns the automatic color off.
# The clear screen below also removes the error text of jj, for example on a
# stale working copy. Thus keep the error and show it in place of the log.
errors=$(mktemp)
if ! log=$(jj log --no-pager --color=always "$@" 2>"$errors"); then
  log=$(cat "$errors")
fi
rm -f "$errors"
frame=$(printf '%s\\n' "$log" | awk -v mode="$mode" -v rows="$rows" '
  {
    line[NR] = $0
    # The color codes hide the graph, so read `@` from a clean copy.
    if (!at) {
      plain = $0
      gsub(/\\033\\[[0-9;]*m/, "", plain)
      if (plain ~ /^[^[:alnum:]]*@[[:space:]]/) at = NR
    }
  }
  END {
    start = 1
    if (NR > rows) {
      if (mode == "tail") start = NR - rows + 1
      else if (mode == "center" && at) start = at - int(rows / 2)
      if (start > NR - rows + 1) start = NR - rows + 1
      if (start < 1) start = 1
    }
    for (i = start; i < start + rows && i <= NR; i++) print line[i]
  }
')
# Draw in one synchronized update and park the cursor on the last line, so
# the cursor does not move and a cursor trail shader draws nothing.
printf '\\033[?2026h\\033[H\\033[2J\\033[3J%s\\033[%d;1H\\033[?2026l' "$frame" "$((rows + 1))"
SHOW
  )
  # watchexec does not redraw on a resize. This helper gets the SIGWINCH of
  # the terminal and writes to a file that watchexec watches. The helper
  # stops when watchexec ($$ after the exec) stops.
  # pwd -P: the events come with the real path, not the /var link.
  resize=$(cd "$(mktemp -d)" && pwd -P)
  (
    count=0
    trap 'count=$((count + 1)); echo "$count" >"$resize/size"' WINCH
    while kill -0 $$ 2>/dev/null; do
      # The wait stops on a signal, so the redraw does not wait for sleep.
      sleep 1 & wait $! || true
    done
    rm -rf "$resize"
  ) &
  # --no-vcs-ignore: jj writes .jj/.gitignore with "/*", which hides the events.
  # -n: run jj directly, not through $SHELL, so quoted revsets stay intact.
  exec watchexec -n --quiet --no-vcs-ignore \\
    --debounce 200ms --on-busy-update queue \\
    --watch "$repo/op_heads/heads" --watch "$resize" \\
    -- bash -c "$show" logwatch "$mode" "$terminal" ${args[@]+"${args[@]}"}
""",
  "",
]
# Check if the current change is empty (both no files and no description)
isempty = [
  "log",
  "-r",
  "@",
  "-T",
  """if(empty && description.first_line() == "", "true", "false")""",
  "--no-graph",
]
long-id = ["log", "-r", "@", "-T", "change_id", "--no-graph"]
short-id = ["log", "-r", "@", "-T", "change_id.short()", "--no-graph"]
fetch-pr = ["util", "exec", "--", "bash", "-c", """
  set -euo pipefail
  pr_number="${1:?PR number is required}"
  git fetch origin "pull/$pr_number/head:pr/$pr_number"
  jj new "pr/$pr_number"
""", ""]
